
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header>
      <h1>TaskFlow<span>.</span></h1>
      <p>Manage your work. Stay productive.</p>
    </header>

    <section class="stats">
      <div class="stat">
        <h2 id="total">0</h2>
        <p>Total Tasks</p>
      </div>
      <div class="stat">
        <h2 id="pending">0</h2>
        <p>Pending</p>
      </div>
      <div class="stat">
        <h2 id="completed">0</h2>
        <p>Completed</p>
      </div>
    </section>

    <section class="task-box">

      <h2>My Tasks</h2>

      <form id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="Enter your task..."
          required
        >
        <button type="submit">+ Add Task</button>
      </form>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>

      <div id="taskList"></div>

    </section>

    <footer>
      © 2026 TaskFlow | Built with HTML, CSS & JavaScript
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
